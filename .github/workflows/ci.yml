name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.12', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build and install
        run: python -m pip install .
      - name: Exercise installed demo outside source tree
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          opscheck --version
          opscheck flow-demo --fail-once quality_agent
          opscheck runs
          python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
